# 推到 main 就构建并发布到本仓库的项目站点：
# https://decli.github.io/ForeignTradeManagementSystem/
#
# 主站点是 https://decli.github.io/ftms/，由 `npm run deploy` 推到
# decli/decli.github.io 仓库的 ftms/ 子目录，那个仓库走 Pages 的
# 「从分支发布」模式，跟这条流水线互不干扰。
# 这里发的是**镜像**：两个 URL 一份内容，所以 canonical 一律指向主站
# （见 vite.config.ts 的 CANONICAL），搜索引擎只会收录主站那一份。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:project
        env:
          # 两个 secret 都没配也能构建成功：
          #   没有 GOOGLE_CLIENT_ID → 登录页退回账密登录
          #   没有 GA_ID           → 一行统计脚本都不加载
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
