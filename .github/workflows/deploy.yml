# 推到 main 就构建并发布到本仓库的项目站点：
# https://decli.github.io/ForeignTradeManagementSystem/
#
# 主站点 https://decli.github.io/ 由 `npm run deploy` 推到 decli/decli.github.io，
# 那个仓库是 Pages 的「从分支发布」模式，跟这条流水线互不干扰。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:project
        env:
          # 没配这个 secret 也能构建成功，登录页会退回账密登录
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
