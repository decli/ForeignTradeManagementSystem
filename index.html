<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="信风 Tradewind —— 你的外贸全流程数智化助手：询盘、报价、跟单、核算、收汇、退税，每一票货全程可见。纯前端演示版，数据存在你自己的浏览器里。"
    />
    <!-- 版权只出现在三处不打扰人的地方：这里、登录页页脚、设置页「关于」 -->
    <meta name="author" content="decli" />
    <meta name="copyright" content="© 2026 decli" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>信风 Tradewind · 外贸业务全流程</title>
    <script>
      // 主题要在首帧之前定，否则深色用户会先看到一闪的白底
      (function () {
        try {
          var t = localStorage.getItem("mt.theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
          var d = localStorage.getItem("mt.density");
          if (d) document.documentElement.dataset.density = d;
          // 主色同理：晚一帧的话，选了松石绿的人每次刷新都要先看一眼蓝色
          var a = localStorage.getItem("mt.accent");
          if (a) document.documentElement.dataset.accent = a;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark" aria-hidden="true"></div>
        <p>正在装载账套…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
