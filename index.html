      <div class="noscript-doc">
        <h1>信风 Tradewind · 外贸业务全流程管理系统</h1>
        <p><strong>每一票货，全程可见。</strong>询盘、报价、采购、跟单、核算、收汇、退税，一条线走完。</p>
        <p>
          本站是一个纯前端的在线演示，需要启用 JavaScript 才能运行。演示账号
          <code>admin</code> / <code>demo1234</code>，无需注册，进去后可切换业务员、财务、只读等身份。
        </p>

        <h2>它解决什么</h2>
        <p>
          外贸公司的单、货、钱、票散在 Excel、微信和邮箱里，「这单到哪了」要靠人去问。信风用同一个
          PI 号把 33 个模块串成一条链：任何一票货，从第一封询盘到最后一笔退税，每一步都查得到。
        </p>

        <h2>主要模块</h2>
        <ul>
          <li><strong>售前</strong> —— 询盘管理（分配与 SLA）、报价单（多版本议价轨迹）、样品管理</li>
          <li><strong>订单</strong> —— PI 取号、商品明细行、订单核算跟踪与利润率预警</li>
          <li><strong>采购生产</strong> —— 询价比价、采购合同、生产单、库存可用量（账面减已锁定）</li>
          <li><strong>出运跟单</strong> —— 里程碑航程线（交期/装柜/进仓/ATD/ETA）、停滞与超期识别、运费询价、单证备案</li>
          <li><strong>收付退税</strong> —— 收付款认领、应收账龄（账期从提单日起算）、出口退税、银行日记账、资金汇总、中信保额度</li>
          <li><strong>档案与分析</strong> —— 客户/产品/供应商、开票资料、报表中心、提成与绩效（按利润率分档）</li>
        </ul>

        <h2>技术形态</h2>
        <ul>
          <li>Vite 7 + React 19 + TypeScript + react-router 7；不引入 UI 库、CSS 框架、图表库、状态管理库</li>
          <li>数据存在浏览器 IndexedDB 里，无服务端、无数据库进程，可部署到任何静态托管</li>
          <li>金额一律以「分」为单位的整数存储，避免浮点误差让核算与退税凑不平账</li>
          <li>中英双语、深浅两套主题 × 五套主题色；行级数据范围 + 字段级权限</li>
        </ul>

        <h2>边界</h2>
        <p>
